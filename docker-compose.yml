# Demonstrates the horizontal-scaling architecture the project was built
# around from the start: multiple stateless backend replicas, coordinated
# through Redis (the channel layer) so a WebSocket event from a client on
# one replica reaches a client connected to a different replica — proven
# manually earlier, this compose file makes it a real, repeatable setup.
#
# Run with: docker compose up --build
# Then: docker compose exec backend1 python manage.py migrate

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatapp
      POSTGRES_USER: chatapp
      POSTGRES_PASSWORD: chatapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend1:
    build: .
    environment:
      DATABASE_NAME: chatapp
      DATABASE_USER: chatapp
      DATABASE_PASSWORD: chatapp
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend1,backend2,nginx"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    depends_on:
      - redis
      - db

  backend2:
    build: .
    environment:
      DATABASE_NAME: chatapp
      DATABASE_USER: chatapp
      DATABASE_PASSWORD: chatapp
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend1,backend2,nginx"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    depends_on:
      - redis
      - db

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - backend1
      - backend2

volumes:
  postgres_data:
