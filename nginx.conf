# Load balances across both backend replicas. "least_conn" is a better
# fit than the default round-robin for a WebSocket-heavy app — a
# long-lived chat connection ties up a worker for its whole duration,
# so routing new connections to whichever replica has fewer active
# connections keeps load more even than blindly alternating.
upstream chat_backend {
    least_conn;
    server backend1:8000;
    server backend2:8000;
}

server {
    listen 80;

    location / {
        proxy_pass http://chat_backend;

        # Required for WebSocket upgrade — without these three headers,
        # nginx proxies the connection as plain HTTP and every WS
        # handshake fails. This is the single most common mistake when
        # putting a reverse proxy in front of a Channels app.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket connections are long-lived — the default proxy
        # timeouts (60s) would silently kill idle chat connections.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
